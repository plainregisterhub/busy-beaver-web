<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="light">
  <title>DAY ONE — Builder Workshop</title>
  <meta name="description" content="DAY ONE — Builder Workshop">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="page">

    <section class="hero" aria-label="DAY ONE Builder Workshop">
      <div class="hero__bg" aria-hidden="true"></div>

      <div class="hero__content">
        <div class="hero__logo" aria-label="DAY ONE">
          <img src="./assets/text/webp/day_01.webp" alt="01">
          <span>DAY ONE</span>
        </div>

        <div class="hero__headline">
          <p class="eyebrow">BUILDER WORKSHOP</p>
          <h1>ONE DAY.<br>ONE MISSION.</h1>
          <p class="subhead">
            Three builders. One mission. One day to make it happen.
          </p>
        </div>

        <div class="hero__characters" aria-hidden="true">
          <img
            src="./assets/characters/builders_characters.webp"
            alt=""
          >
        </div>

        <div class="hero__cta">
          <a class="cta cta--primary" href="#" aria-label="Launch on Pump.fun">
            LAUNCH ON PUMP.FUN
          </a>
          <a class="cta cta--secondary" href="#mission">
            VIEW MISSION
          </a>
        </div>
      </div>
    </section>

    <section class="mission" id="mission">
      <div class="mission__inner">
        <p class="eyebrow">MISSION</p>
        <h2>BUILD IT.<br>SHIP IT.</h2>
        <p class="mission__copy">
          A focused one-day build sprint designed around execution,
          momentum and getting the thing out into the world.
        </p>
      </div>
    </section>

  </main>
</body>
</html>
